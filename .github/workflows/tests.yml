name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interviewiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d interviewiq_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Load database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --port 5432 --username postgres \
            --dbname interviewiq_test --file db_structure.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/interviewiq_test
          SECRET_KEY: test-secret-key-for-ci-only-0123456789abcdef
          GOOGLE_API_KEY: dummy-key
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q
